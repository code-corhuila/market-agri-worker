databaseChangeLog:
  - changeSet:
      id: dcl-grants-001
      author: contreras-elkin
      labels: "HU-NOTIF-001,dcl,grants"
      comment: "Least privilege on the worker schema: the writer reads, inserts and deletes (the purge; no UPDATE); the reader only reads."
      changes:
        - sqlFile:
            path: 001_grant_schema_privileges.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/01_grants/001_grant_schema_privileges.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
  - changeSet:
      id: dcl-grants-002
      author: contreras-elkin
      labels: "HU-NOTIF-001,dcl,grants"
      comment: "worker_app, created by market-agri-infra, receives worker_writer (Anexo J.7)."
      changes:
        - sqlFile:
            path: 002_grant_writer_to_app.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/01_grants/002_grant_writer_to_app.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
