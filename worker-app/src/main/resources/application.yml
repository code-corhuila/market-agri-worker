# Composition root: every limit of the service is declared here, with its value (Anexo C 5.3.10).
spring:
  application:
    name: market-agri-worker
  lifecycle:
    timeout-per-shutdown-phase: 20s     # graceful shutdown: a message in progress finishes or is redelivered
  web:
    resources:
      add-mappings: false               # the worker serves no static files
  # PostgreSQL of market-agri-infra, always as worker_app. Without these variables the service does
  # not start. The schema comes from db/ through worker-db-migrate: nothing here migrates (ADR-013).
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5                          # connections: one consumer, one message at a time
      connection-timeout: 5000                      # ms waiting for a free connection
      connection-init-sql: SET statement_timeout = '5s'   # per statement, on every connection
  sql:
    init:
      mode: never                       # no schema.sql or data.sql, ever (norm 5.2.1)

server:
  port: ${PORT:8080}
  shutdown: graceful                    # finish in-flight requests before stopping
  tomcat:
    connection-timeout: 5s              # reading the request headers
    keep-alive-timeout: 60s             # idle connection

# One JSON object per log line; the MDC (correlationId) goes into every line (Anexo C 5.3.9).
logging:
  structured:
    format:
      console: ecs

# The notifications of ADR-016. Without the URLs, the token and the sender the service does not start.
worker:
  auth-api-url: ${AUTH_API_URL}               # I-07, by its service name in the platform network
  service-token: ${SERVICE_TOKEN}             # the worker's own token, issued by I-01 (ADR-020)
  public-base-url: ${PUBLIC_BASE_URL}         # the link of each e-mail: <PUBLIC_BASE_URL>/transacciones/<id>
  http-timeout: ${HTTP_TIMEOUT:3s}            # per I-07 attempt (Annex D, rule 6)
  smtp:
    host: ${SMTP_HOST}                        # Mailpit in every course environment
    port: ${SMTP_PORT:1025}
    from: ${MAIL_FROM}
    timeout: 5s                               # connect and each reply
  retry:                                      # ADR-014: network, 429, 5xx and SMTP 4xx only
    attempts: 5
    base: 1s                                  # full jitter: 0..min(cap, base × 2ⁿ) before attempt n + 1
    cap: 30s
  broker:
    enabled: ${WORKER_BROKER_ENABLED:false}
    host: ${BROKER_HOST:rabbitmq}
    port: ${BROKER_PORT:5672}
    username: ${BROKER_USERNAME:worker_app}
    password: ${BROKER_PASSWORD:}
