# Unit and HTTP tests run without a database: the pool points to an address nobody listens on.
# The integration tests use TEST_DATABASE_URL (JdbcProcessedEventsIT).
spring.datasource.url=jdbc:postgresql://localhost:1/unreachable
spring.datasource.username=worker_app
spring.datasource.password=unused
# The notifications of ADR-016: nobody listens on port 1, so a test that reaches auth or SMTP by
# mistake gets no answer. The token is a placeholder; the broker consumer stays off.
worker.auth-api-url=http://localhost:1
worker.service-token=test-service-token
worker.public-base-url=http://localhost:8000
worker.smtp.host=localhost
worker.smtp.port=1
worker.smtp.from=notificaciones@market-agri.test
