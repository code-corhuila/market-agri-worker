# Included by market-agri-infra (Anexo G). No `ports`: only the API Gateway publishes one, and the
# worker is never routed by it (ADR-016). PostgreSQL and worker_app are owned by infra;
# worker-db-migrate is the deliberate migration runner of the worker schema (ADR-013) and the
# service never migrates.
services:
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${PG_DATABASE:?set PG_DATABASE}
      DATABASE_USER: worker_app
      DATABASE_PASSWORD: ${WORKER_APP_PASSWORD:?set WORKER_APP_PASSWORD}
      AUTH_API_URL: http://auth-api:8080
      SERVICE_TOKEN: ${WORKER_SERVICE_TOKEN:?set WORKER_SERVICE_TOKEN}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: ${MAIL_FROM:-notificaciones@market-agri.local}
      WORKER_BROKER_ENABLED: ${WORKER_BROKER_ENABLED:-true}
      BROKER_PASSWORD: ${WORKER_BROKER_PASSWORD:?set WORKER_BROKER_PASSWORD}
    depends_on:                       # postgres lives in market-agri-infra; resolved when included
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:                      # liveness: the only HTTP endpoint of the worker (norm 5.7.1)
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    # Longer than the 20 s graceful shutdown declared in application.yml.
    stop_grace_period: 25s
    restart: unless-stopped
    networks: [platform]

  worker-db-migrate:
    image: liquibase/liquibase:4.29
    profiles: [tooling]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../db:/workspace:ro
    entrypoint:
      - liquibase
      - --search-path=/workspace
      - --changelog-file=changelog/changelog-master.yaml
      - --url=jdbc:postgresql://postgres:5432/${PG_DATABASE:?set PG_DATABASE}
      - --username=${PG_ADMIN_USER:?set PG_ADMIN_USER}
      - --password=${PG_ADMIN_PASSWORD:?set PG_ADMIN_PASSWORD}
      - --database-changelog-table-name=databasechangelog_worker
      - --database-changelog-lock-table-name=databasechangeloglock_worker
    command: [update]
    networks: [platform]

networks:
  platform:
    name: platform-${ENV:?set ENV}
    external: true
